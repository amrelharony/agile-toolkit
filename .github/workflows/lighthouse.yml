name: Lighthouse

# Captures mobile Lighthouse baselines for PUBLIC routes. Tool routes are public
# (browser-only, no sign-in), so lighthouserc.json collects the landing page, a
# representative tool and the comic reader. Owner-only pages (/settings/*) need
# an authenticated run, which this workflow does NOT do — see
# docs/LIGHTHOUSE.md. Runs on PRs and on demand; the assertions in
# lighthouserc.json are warnings, so this reports scores without failing the
# build — except accessibility, which is a hard gate (>= 0.95).

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse CI (public routes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A full type check of the app needs about 2.7 GB of heap (tsc
    # --extendedDiagnostics, 2026-10-25), over Node's default of about 2 GB
    # on a hosted runner, so tsc and next build ran out of memory. The
    # runner has 16 GB.
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Same harmless placeholders as ci.yml — no real network calls.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder
          AUTHORIZED_EMAILS: ci-placeholder@example.com

      - name: Lighthouse CI
        # lhci `autorun` boots `next start` (per lighthouserc.json's
        # startServerCommand), collects 3 runs against the public routes,
        # asserts the budgets, and uploads the report to temporary public
        # storage (the run log prints the report URL).
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder
          AUTHORIZED_EMAILS: ci-placeholder@example.com
